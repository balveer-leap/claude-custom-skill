# Claude estate-aware PR review, driven by the `estate-review` skill.
#
# Copy to .github/workflows/claude-review.yml in each repository of the estate.
# Setup (repository or organisation level):
#   secret   CLAUDE_CODE_OAUTH_TOKEN  from `claude setup-token` (or swap in anthropic_api_key)
#   variable ESTATE_REPOS             space-separated sibling repos, e.g. "acme/billing acme/ledger"
#   variable SKILL_REPO (optional)    repo holding skills/estate-review; defaults to balveer-leap/claude-custom-skill
#   secret   ESTATE_TOKEN (optional)  read token, only needed if siblings or SKILL_REPO are private
name: Claude Review (estate-aware)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install the estate-review skill
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.SKILL_REPO || 'balveer-leap/claude-custom-skill' }}
          token: ${{ secrets.ESTATE_TOKEN || github.token }}
          path: .estate-review-skill
          fetch-depth: 1
      - run: |
          mkdir -p .claude/skills
          cp -R .estate-review-skill/skills/estate-review .claude/skills/
          rm -rf .estate-review-skill

      - name: Clone the rest of the estate (read-only context)
        env:
          ESTATE_TOKEN: ${{ secrets.ESTATE_TOKEN }}
          ESTATE_REPOS: ${{ vars.ESTATE_REPOS }}
        run: |
          set -u
          mkdir -p .estate
          # Clear the checkout's job-token header so clones never send two credentials.
          # ESTATE_TOKEN is sent per command, never in the URL, so it is not saved in
          # .estate/*/.git/config where Claude could read it.
          clear=(-c "http.https://github.com/.extraheader=")
          for full in $ESTATE_REPOS; do
            [ "$full" = "${{ github.repository }}" ] && continue
            name="${full#*/}"
            url="https://github.com/${full}.git"
            if git "${clear[@]}" clone --depth 1 --quiet "$url" ".estate/${name}" 2>/dev/null; then
              echo "  cloned ${full}"
            elif [ -n "${ESTATE_TOKEN:-}" ] && git "${clear[@]}" \
                -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ESTATE_TOKEN" | base64 | tr -d '\n')" \
                clone --depth 1 --quiet "$url" ".estate/${name}" 2>/dev/null; then
              echo "  cloned ${full} (with ESTATE_TOKEN)"
            else
              echo "  SKIP ${full} (clone failed)"
            fi
          done
          if [ -n "${ESTATE_TOKEN:-}" ] && grep -rqs "$ESTATE_TOKEN" .estate/*/.git/config; then
            echo "ESTATE_TOKEN found in a clone's .git/config; stopping before Claude runs" >&2
            exit 1
          fi
          ls -1 .estate || true

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          # Read-only tools plus Skill. No shell and no web, so the review cannot fetch
          # anything beyond this checkout and the .estate/ clones.
          claude_args: "--max-turns 80 --allowedTools Skill,Read,Grep,Glob,LS"
          prompt: |
            Use the estate-review skill to review this pull request.
            Sibling repositories are cloned read-only in `.estate/`.
